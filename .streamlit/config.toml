[browser]
# Niente statistiche d'uso inviate a Streamlit (e niente richiesta di e-mail al primo avvio).
gatherUsageStats = false

# Tema "legno" (come la presentazione): crema e marrone in chiaro, viola scuro e legno chiaro in scuro.
# L'utente può scegliere dal menu delle impostazioni o dal pulsante nell'intestazione (vedi chess_tutor/webapp.py).
[theme]
baseRadius = "medium"
showWidgetBorder = true
headingFont = "Cambria, Georgia, serif"

[theme.light]
primaryColor = "#A5582D"
backgroundColor = "#FBF4E4"
secondaryBackgroundColor = "#F3E4BF"
textColor = "#2B2433"
linkColor = "#8B4A24"
borderColor = "#D9C7A3"

[theme.dark]
primaryColor = "#E3A66E"
backgroundColor = "#231D2B"
secondaryBackgroundColor = "#2B2433"
textColor = "#F3E4BF"
linkColor = "#E3A66E"
borderColor = "#4A4A6A"
