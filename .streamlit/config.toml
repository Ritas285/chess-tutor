[browser]
# Niente statistiche d'uso inviate a Streamlit (e niente richiesta di e-mail al primo avvio).
gatherUsageStats = false

# Tema "scacchiera": verde e crema in chiaro, grigio scuro in scuro. L'utente può scegliere dal menu delle impostazioni.
[theme]
baseRadius = "medium"
showWidgetBorder = true

[theme.light]
primaryColor = "#4F7A39"
backgroundColor = "#FBF8F1"
secondaryBackgroundColor = "#EEEED2"
textColor = "#2B2B2B"
linkColor = "#3E6B2A"
borderColor = "#D6D2BE"

[theme.dark]
primaryColor = "#86A666"
backgroundColor = "#262421"
secondaryBackgroundColor = "#312E2B"
textColor = "#EEEED2"
linkColor = "#A9C58A"
borderColor = "#45413C"
